# LOCAL production-like run of the backend container (production itself is deployed by GitHub Actions,
# see deploy/DEPLOY.md). From the repository root:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://localhost:3001/api/health
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: product-search-agent-server:local
    restart: unless-stopped
    init: true
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend-logs:/app/backend/logs

volumes:
  backend-logs:
